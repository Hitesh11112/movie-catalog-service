<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">Chat App</div>
        <div class="auth-tabs">
            <button id="tab-login" class="tab active" onclick="switchTab('login')">Login</button>
            <button id="tab-register" class="tab" onclick="switchTab('register')">Register</button>
        </div>

        <div id="login-form" class="form">
            <input id="login-username" placeholder="Username" />
            <input id="login-password" type="password" placeholder="Password" />
            <button onclick="login()">Login</button>
            <p id="login-error" class="error"></p>
        </div>

        <div id="register-form" class="form hidden">
            <input id="register-username" placeholder="Username" />
            <input id="register-password" type="password" placeholder="Password" />
            <button onclick="register()">Register</button>
            <p id="register-error" class="error"></p>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
